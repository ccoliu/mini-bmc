name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensord:
    name: sensord (C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck lcov

      - name: Build (-Werror)
        run: make -C sensord

      - name: Unit tests
        run: make -C sensord test

      - name: Unit tests under ASan + UBSan
        run: make -C sensord sanitize

      - name: Static analysis (cppcheck)
        run: make -C sensord cppcheck

      - name: Coverage
        run: |
          make -C sensord coverage
          {
            echo '### sensord unit-test coverage'
            echo '```'
            lcov --summary sensord/build/cov/coverage.info --rc branch_coverage=1 2>&1 \
              | grep -E 'lines|functions|branches'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sensord-coverage
          path: sensord/build/cov/html

      - name: Upload sensord binaries
        uses: actions/upload-artifact@v4
        with:
          name: sensord-bin
          path: |
            sensord/build/sensord
            sensord/build/asan/sensord
          retention-days: 3

  integration:
    name: integration (pytest)
    needs: sensord
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: release, bin: sensord/build/sensord }
          - { name: asan, bin: sensord/build/asan/sensord }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sensord-bin
          path: sensord/build

      - run: chmod +x sensord/build/sensord sensord/build/asan/sensord

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Lint (ruff)
        if: matrix.variant.name == 'release'
        run: |
          ruff check .
          ruff format --check .

      - name: pytest against ${{ matrix.variant.name }} build
        env:
          SENSORD_BIN: ${{ matrix.variant.bin }}
        run: pytest -v
