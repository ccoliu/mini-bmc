name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensord:
    name: sensord (C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck lcov

      - name: Build (-Werror)
        run: make -C sensord

      - name: Unit tests
        run: make -C sensord test

      - name: Unit tests under ASan + UBSan
        run: make -C sensord sanitize

      - name: Static analysis (cppcheck)
        run: make -C sensord cppcheck

      - name: Coverage
        run: |
          make -C sensord coverage
          {
            echo '### sensord unit-test coverage'
            echo '```'
            lcov --summary sensord/build/cov/coverage.info --rc branch_coverage=1 2>&1 \
              | grep -E 'lines|functions|branches'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sensord-coverage
          path: sensord/build/cov/html

      - name: Upload sensord binaries
        uses: actions/upload-artifact@v4
        with:
          name: sensord-bin
          path: |
            sensord/build/sensord
            sensord/build/asan/sensord
          retention-days: 3

  redfishd:
    name: redfishd (lint, types, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: redfishd/pyproject.toml

      # Same layout as local development: the pyrefly config points at .venv.
      - name: Install (.venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "./redfishd[dev]"

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check (pyrefly)
        run: |
          .venv/bin/pyrefly check
          cd redfishd && ../.venv/bin/pyrefly check

      - name: Unit tests
        working-directory: redfishd
        run: ../.venv/bin/pytest -v

  integration:
    name: integration (pytest)
    needs: sensord
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: release, bin: sensord/build/sensord }
          - { name: asan, bin: sensord/build/asan/sensord }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sensord-bin
          path: sensord/build

      - run: chmod +x sensord/build/sensord sensord/build/asan/sensord

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: redfishd/pyproject.toml

      - name: Install (.venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "./redfishd[dev]"

      # Includes the DMTF schema conformance crawl against the real daemon.
      - name: pytest against ${{ matrix.variant.name }} sensord
        env:
          SENSORD_BIN: ${{ matrix.variant.bin }}
        run: .venv/bin/pytest -v

  docker:
    name: docker compose (smoke test, DMTF validators)
    runs-on: ubuntu-24.04
    env:
      # The stack's self-signed certificate, copied out below: every client verifies against it.
      REDFISH_CA: mini-bmc-ca.pem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 120

      - name: Fetch the TLS certificate
        run: docker compose cp redfishd:/var/lib/redfishd/tls/cert.pem "$REDFISH_CA"

      - name: Smoke test
        run: scripts/smoke_test.sh

      # Their own venv: the validators and their dependencies are not part of redfishd.
      - name: Install DMTF Redfish validators
        run: |
          python -m venv /tmp/dmtf
          /tmp/dmtf/bin/pip install redfish_service_validator==3.1.8 \
            redfish-protocol-validator==1.3.2

      # The response bodies, against the DMTF CSDL schemas.
      - name: DMTF Redfish Service Validator
        env:
          RSV: /tmp/dmtf/bin/rf_service_validator
        run: scripts/service_validator.sh

      # HTTP behaviour (headers, status codes, sessions, TLS), against the known failures.
      - name: DMTF Redfish Protocol Validator
        if: success() || failure()
        env:
          RPV: /tmp/dmtf/bin/rf_protocol_validator
        run: scripts/protocol_validator.sh

      - name: Upload validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmtf-validator-reports
          path: |
            validator-report
            protocol-report
          if-no-files-found: ignore

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
